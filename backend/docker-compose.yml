services:
  backend:
    image: milanolibrary_backend
    build:
      context: .
      dockerfile: Dockerfile
      pull: false
    container_name: MilanoLibrary_backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./models:/app/models
      - "${HOME:-${USERPROFILE}}:/host_home"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - HF_TOKEN=${HF_TOKEN:-}
      - HOST_HOME_PATH=${HOME:-${USERPROFILE}}
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: milanolibrary-redis
    ports:
      - 6379:6379
    volumes:
      - redis-data:/data

volumes:
  redis-data:
