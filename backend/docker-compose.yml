services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      pull: false
    container_name: milanolibrary-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./models:/app/models
      - "${HOME:-${USERPROFILE}}:/host_home"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - HF_TOKEN=${HF_TOKEN:-}
      - HOST_HOME_PATH=${HOME:-${USERPROFILE}}
    depends_on:
      - redis
